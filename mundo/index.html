<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorrido del Altiplano</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#263c31;font:15px system-ui,sans-serif}main{height:clamp(370px,52vw,520px);position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#e8cdb3,#efdcb0)}canvas{display:block;width:100%;height:100%}button{font:inherit;cursor:pointer;color:inherit}#caption,#hint,#touch,#action{position:absolute}#caption{top:16px;left:18px;pointer-events:none}small{font-size:11px;letter-spacing:.15em;text-transform:uppercase}h1{font:normal clamp(25px,5vw,42px) Georgia,serif;margin:2px 0}#hint{bottom:14px;left:14px;background:#faf6e9ef;border-radius:12px;padding:8px 12px;font-size:13px;max-width:60%}#touch{right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,38px);gap:3px}#touch button,#action{border:0;background:#263c31;color:#fff;border-radius:9px;padding:7px;touch-action:none}#action{left:15px;bottom:72px;background:#a04424;font-weight:600}#markers button{position:absolute;transform:translate(-50%,-100%);border:1px solid #fdf7eb;background:#334a3df2;color:white;padding:4px 9px;border-radius:12px;font-size:12px;white-space:nowrap}#markers button[aria-current=true]{background:#a04424}button:focus-visible,canvas:focus-visible{outline:3px solid #007bbb;outline-offset:-3px}

main{height:100dvh;border-radius:0}#caption{top:clamp(16px,3vw,40px);left:clamp(16px,3vw,40px)}
#menu{position:absolute;top:18px;right:15px;z-index:2;text-align:right}
#menu button{background:#faf4e8;color:#304639;border:1px solid #a59b7f;border-radius:12px;padding:8px 12px}
#destinos{margin-top:6px;display:grid;gap:4px}#destinos[hidden],#touch[hidden]{display:none}
@media(max-width:520px){#menu{top:12px;bottom:auto}#caption h1{font-size:28px}}
#markers button.cerca{background:#744423;border-color:#ffd781}
#action{left:50%;bottom:25px;transform:translateX(-50%);padding:12px 22px;background:#384434;color:#fff5db;border:2px solid #f5cf84;border-radius:30px;box-shadow:0 4px 18px #42372542}
@media(max-width:700px){#action{bottom:270px;left:14px;transform:none}}
@media(pointer:fine){#touch{display:none}}
#touch{bottom:calc(108px + env(safe-area-inset-bottom));right:16px;grid-template-columns:repeat(3,52px);gap:5px;z-index:4}
#touch button{width:52px;height:52px;padding:0;font-size:20px;box-shadow:0 3px 10px #1c2b2540}
@media(max-width:520px){#hint{max-width:48%;font-size:11px}#touch{right:12px}}
#mini{position:absolute;right:16px;top:75px;width:124px;height:130px;background:#f8efdbe8;border:1px solid #b4a185;border-radius:10px;pointer-events:none}#viaje{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#23453e;color:white;border-radius:18px;padding:8px 14px;pointer-events:none}#viaje:empty{display:none}#portalLabel{position:absolute;transform:translate(-50%,-100%);background:#215650;color:white;border:1px solid #a1e5c5;border-radius:12px;padding:4px 10px;pointer-events:none;white-space:nowrap}
@media(max-width:650px){#mini{width:92px;height:97px;top:95px;right:8px}#viaje{top:110px}}
#transicion{position:absolute;inset:0;display:grid;place-items:center;background:#ede2cb;color:#394f40;font:clamp(28px,5vw,62px) Georgia,serif;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s;z-index:5;pointer-events:none}
#transicion.visible{visibility:visible;opacity:1;transition-delay:0s;pointer-events:auto}
@media(prefers-reduced-motion:reduce){#transicion{transition:none}}
</style>
<main><canvas tabindex="0" aria-label="Conduce el tractor con las flechas. Pulsa E cerca de una estación."></canvas><div id="caption"><small>Farmastra · Altiplano boliviano</small><h1></h1></div><canvas id="mini" width="248" height="260" aria-label="Plano de la finca con las estaciones, el portal y tu tractor"></canvas><div id="viaje" role="status"></div><div id="portalLabel" hidden></div><nav id="markers" aria-label="Estaciones"></nav><div id="menu"><button id="overview" aria-pressed="false">Vista aérea · M</button> <button id="openmenu" aria-expanded="false">Estaciones</button><div id="destinos" hidden></div></div><div id="hint">Flechas para conducir · Arrastra para mirar · E para entrar</div><button id="action" hidden></button><div id="touch" aria-label="Conducir"><span></span><button data-key="ArrowUp" aria-label="Avanzar">▲</button><span></span><button data-key="ArrowLeft" aria-label="Girar a la izquierda">◀</button><button data-key="ArrowDown" aria-label="Retroceder">▼</button><button data-key="ArrowRight" aria-label="Girar a la derecha">▶</button></div><div id="transicion" aria-hidden="true"></div></main>
<script>
const send=(type,payload={})=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:'+type,...payload},'*');
const resize=()=>send('setFrameHeight',{height:window.innerHeight});
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return; window.farmArgs=e.data.args;document.querySelector('h1').textContent=farmArgs.localidad;window.dispatchEvent(new Event('farmrender'));resize()});
window.viajar=destino=>send("setComponentValue",{value:{tipo:"viaje",destino,token:Date.now()},dataType:"json"});
window.visitFarm=name=>{
 window.dispatchEvent(new CustomEvent('farmenter',{detail:name}));
 send('setComponentValue',{value:{name,token:Date.now()},dataType:'json'});
};
const destinos=document.querySelector('#destinos'), menu=document.querySelector('#openmenu');
for(const name of ['Rotaciones','Estación climática','Sensor de suelo','Aplicación del agricultor']){
 const b=document.createElement('button'); b.textContent=name;
 b.onclick=()=>{menu.click();visitFarm(name)};destinos.append(b);
}
menu.onclick=()=>{destinos.hidden=!destinos.hidden;menu.setAttribute('aria-expanded',String(!destinos.hidden))};
new ResizeObserver(resize).observe(document.querySelector('main'));send('componentReady',{apiVersion:1});
</script><script type="module" src="./escena.js"></script></html>
